# Ergänzung zur bestehenden /opt/pokemonhub/romm/docker-compose.yml.
services:
  romm:
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  romm-db:
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
